name: Release

# Publishing runs only from a version tag pushed to the repository, never from
# a pull request or a branch push.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A protected environment holds NPM_TOKEN and can require a reviewer.
    environment: npm
    permissions:
      contents: read
      # Lets npm obtain the OIDC token behind `--provenance`.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The tag must name the framework version being published.
      - name: Check the tag matches the framework version
        run: |
          expected="v$(node -p "require('./core/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match $expected" >&2
            exit 1
          fi

      # scripts/release.mjs refuses a dirty tree, runs `npm run check`,
      # publishes every public workspace in dependency order with
      # `--ignore-scripts --provenance`, and skips versions already on the
      # registry, so re-running a failed release resumes it.
      - name: Release
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
